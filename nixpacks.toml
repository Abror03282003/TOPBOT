[providers]
providers = ["python"]
 
[variables]
PYTHON_VERSION = "3.11"
 
[phases.setup]
nixPkgs = ["python311"]
aptPkgs = ["ffmpeg"]
 
[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && pip install -U --pre 'yt-dlp[default]'"
]
 
[start]
cmd = "python bot.py"
 
